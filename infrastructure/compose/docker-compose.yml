version: '3.9'

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ../../backend/.env
    environment:
      - DB_PATH=/app/data/harvey.db
    volumes:
      - harvey-db:/app/data
    depends_on: []
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend-test:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.dev.Dockerfile
    env_file:
      - ../../backend/.env
    environment:
      - NODE_ENV=test
      - DB_PATH=/app/data/harvey.db
    volumes:
      - backend-test-db:/app/data
    profiles:
      - test

  node-simulator:
    build:
      context: ../../nodes/simulator
    env_file:
      - ../../nodes/simulator/.env
    depends_on:
      backend:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  firmware-build:
    build:
      context: ../../nodes/esp32
    volumes:
      - ../../nodes/esp32:/workspace
    profiles:
      - firmware
    command: ["pio", "run"]

volumes:
  harvey-db:
  backend-test-db:
  mosquitto-data:
  mosquitto-log:
