version: '3.9'

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ../../backend/.env
    volumes:
      - harvey-db:/app/data
    depends_on: []

  node-simulator:
    build:
      context: ../../nodes/simulator
    env_file:
      - ../../nodes/simulator/.env
    depends_on:
      - backend

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  harvey-db:
  mosquitto-data:
  mosquitto-log:
