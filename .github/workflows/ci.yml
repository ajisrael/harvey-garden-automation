name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f infrastructure/docker/backend.dev.Dockerfile -t harvey-backend-test backend/

      - name: Run tests
        run: docker run --rm harvey-backend-test

  firmware-compile:
    name: Firmware Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PlatformIO image
        run: docker build -t harvey-esp32-build nodes/esp32/

      - name: Copy example LocalConfig.h
        run: cp nodes/esp32/include/LocalConfig.h.example nodes/esp32/include/LocalConfig.h

      - name: Compile firmware
        run: docker run --rm -v $(pwd)/nodes/esp32:/workspace harvey-esp32-build pio run
